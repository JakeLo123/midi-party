# midi-party default keymap: arrow keys + mnemonic letters, no modes.
#
# Arrows move the cursor; Shift+arrows grow a selection box; Alt+arrows move the
# selected notes; Cmd+arrows jump a bar or an octave. Add Shift to a jump to select
# that far, add Shift to an Alt move to move that far. Cmd+a/c/x/v/z work as usual.
# Cmd+e hides or shows the piano roll under the tracks area; Cmd+0 fits the whole
# song in the tracks area again after zooming it. Ctrl+i picks the track's instrument
# (drum kits included); Ctrl+. and Ctrl+, step through presets. Ctrl+r renames the
# track (Enter keeps the new name, Escape cancels); so does double-clicking its name.
#
# One table: [normal].
# Keys:   "Right", "Shift+Right", "n", "[" ... or a sequence "f t" (space separated).
#         Modifiers: Shift+ Ctrl+ Alt+ Cmd+. Named keys: Up Down Left Right Space Enter
#         Escape Tab Backspace Delete Home End PageUp PageDown. Uppercase letters are not
#         accepted: write "Shift+n", not "N". Shifted symbols are spelled with the
#         unshifted key: "?" is "Shift+/", ":" is "Shift+;".
# Values: a command name ("insert_note") or an inline table with arguments
#         ({ cmd = "move_cursor", dir = "right", unit = "grid" }).
# Counts: type digits before a key ("3 Right" moves three steps, "4 n" inserts a note
#         four grid steps long). Each command documents what a count does for it.
# Anything without a key here is reachable from the command line (":" then e.g.
# "quantize 1/8T 50%", "vel 60..110", "sel top", "keep every 3", "rename My Bass",
# "vol 80", "pan L30", "preset 33", "drums", "instruments", "sf2 gm.sf2 33", "reverb 40", "lane sustain",
# "lane_value 90", "ramp_lane 0 127", "pedal").

[normal]
"Left"        = { cmd = "move_cursor", dir = "left",  unit = "grid" }
"Right"       = { cmd = "move_cursor", dir = "right", unit = "grid" }
"Up"          = { cmd = "move_cursor", dir = "up",    unit = "semitone" }
"Down"        = { cmd = "move_cursor", dir = "down",  unit = "semitone" }
"Ctrl+Left"   = { cmd = "move_cursor", dir = "left",  unit = "beat" }
"Ctrl+Right"  = { cmd = "move_cursor", dir = "right", unit = "beat" }
"Cmd+Left"    = { cmd = "move_cursor", dir = "left",  unit = "bar" }
"Cmd+Right"   = { cmd = "move_cursor", dir = "right", unit = "bar" }
"Cmd+Up"      = { cmd = "move_cursor", dir = "up",    unit = "octave" }
"Cmd+Down"    = { cmd = "move_cursor", dir = "down",  unit = "octave" }

# --- selection box: Shift + any cursor key
"Shift+Left"       = { cmd = "extend_selection", dir = "left",  unit = "grid" }
"Shift+Right"      = { cmd = "extend_selection", dir = "right", unit = "grid" }
"Shift+Up"         = { cmd = "extend_selection", dir = "up",    unit = "semitone" }
"Shift+Down"       = { cmd = "extend_selection", dir = "down",  unit = "semitone" }
"Ctrl+Shift+Left"  = { cmd = "extend_selection", dir = "left",  unit = "beat" }
"Ctrl+Shift+Right" = { cmd = "extend_selection", dir = "right", unit = "beat" }
"Cmd+Shift+Left"   = { cmd = "extend_selection", dir = "left",  unit = "bar" }
"Cmd+Shift+Right"  = { cmd = "extend_selection", dir = "right", unit = "bar" }
"Cmd+Shift+Up"     = { cmd = "extend_selection", dir = "up",    unit = "octave" }
"Cmd+Shift+Down"   = { cmd = "extend_selection", dir = "down",  unit = "octave" }

# --- moving notes: Alt + any cursor key
"Alt+Left"         = { cmd = "move_selected", dir = "left",  unit = "grid" }
"Alt+Right"        = { cmd = "move_selected", dir = "right", unit = "grid" }
"Alt+Up"           = { cmd = "move_selected", dir = "up",    unit = "semitone" }
"Alt+Down"         = { cmd = "move_selected", dir = "down",  unit = "semitone" }
"Ctrl+Alt+Left"    = { cmd = "move_selected", dir = "left",  unit = "beat" }
"Ctrl+Alt+Right"   = { cmd = "move_selected", dir = "right", unit = "beat" }
"Alt+Shift+Left"   = { cmd = "move_selected", dir = "left",  unit = "bar" }
"Alt+Shift+Right"  = { cmd = "move_selected", dir = "right", unit = "bar" }
"Alt+Shift+Up"     = { cmd = "move_selected", dir = "up",    unit = "octave" }
"Alt+Shift+Down"   = { cmd = "move_selected", dir = "down",  unit = "octave" }
"Alt+,"            = { cmd = "nudge_selected", ticks = -10 }
"Alt+."            = { cmd = "nudge_selected", ticks = 10 }

# --- notes
"n"           = "insert_note"
"Shift+n"     = { cmd = "insert_chord", intervals = [0, 4, 7] }
"x"           = "delete_selected"
"Delete"      = "delete_selected"
"Backspace"   = "delete_selected"

# --- selection
"s"           = "toggle_select_under_cursor"
"a"           = "select_all"
"Cmd+a"       = "select_all"
"i"           = "invert_selection"
"b"           = "select_bar"
"Shift+s"     = "select_chord"
"w"           = "select_next_notes"
"Shift+e"     = "select_to_end"
"Shift+b"     = "select_to_start"
"Shift+p"     = "select_same_pitch"
"Escape"      = "clear_selection"
"Tab"         = "selection_focus_next"
"Shift+Tab"   = "selection_focus_prev"
"Shift+x"     = "drop_focused"
# filters: f + a second key
"f t"         = "keep_top_of_chords"
"f b"         = "keep_bottom_of_chords"
"f e"         = "keep_every_other"
"f o"         = "keep_on_beat"
"f Shift+o"   = "keep_off_beat"
"f a"         = "keep_above_cursor"
"f l"         = "keep_below_cursor"
"f Shift+a"   = "keep_after_cursor"
"f Shift+b"   = "keep_before_cursor"

# --- clipboard
"c"           = "copy"
"p"           = "paste"
"d"           = "duplicate"
"Cmd+c"       = "copy"
"Cmd+x"       = "cut"
"Cmd+v"       = "paste"

"u"           = "undo"
"Shift+u"     = "redo"
"Cmd+z"       = "undo"
"Cmd+Shift+z" = "redo"

# --- length, velocity, timing
"["           = { cmd = "change_length", delta_steps = -1 }
"]"           = { cmd = "change_length", delta_steps = 1 }
"l"           = { cmd = "set_length", steps = 1 }
"Shift+l"     = "legato"
"-"           = { cmd = "nudge_velocity", delta = -5 }
"="           = { cmd = "nudge_velocity", delta = 5 }
"Shift+-"     = { cmd = "nudge_velocity", delta = -20 }
"Shift+="     = { cmd = "nudge_velocity", delta = 20 }
"h"           = { cmd = "humanize", velocity = 8, timing = 10 }
"q"           = "quantize"
"Shift+q"     = "quantize_length"

# --- view
"g"           = { cmd = "cycle_grid", dir = "next" }
"Shift+g"     = { cmd = "cycle_grid", dir = "prev" }
"t"           = "next_track"
"Shift+t"     = "prev_track"
"Cmd+="       = "zoom_in"
"Cmd+-"       = "zoom_out"
"Cmd+Shift+=" = "zoom_rows_in"
"Cmd+Shift+-" = "zoom_rows_out"
"Cmd+e"       = "toggle_piano_roll"
"Cmd+0"       = "zoom_to_fit"
"Shift+/"     = "toggle_cheat_sheet"

# --- tracks and mixer
"Cmd+t"       = "add_track"
"Cmd+Shift+t" = "remove_track"
"Cmd+d"       = "duplicate_track"
"Cmd+Alt+Up"   = "move_track_up"
"Cmd+Alt+Down" = "move_track_down"
"Ctrl+m"      = "toggle_mute"
"Ctrl+s"      = "toggle_solo"
"Ctrl+="      = { cmd = "nudge_track_volume", delta = 5 }
"Ctrl+-"      = { cmd = "nudge_track_volume", delta = -5 }
"Ctrl+]"      = { cmd = "nudge_track_pan", delta = 10 }
"Ctrl+["      = { cmd = "nudge_track_pan", delta = -10 }
"Ctrl+."      = "next_preset"
"Ctrl+,"      = "prev_preset"
"Ctrl+i"      = "open_instrument_picker"
"Ctrl+r"      = "edit_track_name"

# --- controller lanes (sustain, pitch bend, mod wheel, volume, pan)
"Shift+c"         = "cycle_lane"
"Ctrl+Shift+Up"   = { cmd = "nudge_lane_value", delta = 8 }
"Ctrl+Shift+Down" = { cmd = "nudge_lane_value", delta = -8 }
"Ctrl+Shift+x"    = "clear_lane"
"Ctrl+Shift+d"    = "sustain_down"
"Ctrl+Shift+u"    = "sustain_up"

# --- transport and command line
"Space"       = "toggle_play"
"Enter"       = "playhead_to_start"
"Shift+Enter" = "playhead_to_cursor"
"Alt+Enter"   = "cursor_to_playhead"
","           = "playhead_prev_bar"
"."           = "playhead_next_bar"
"Shift+;"     = "enter_command_line"
