[workspace]
resolver = "2"
members = ["crates/mp-core", "crates/mp-audio", "crates/mp-app", "crates/mp-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
mp-core = { path = "crates/mp-core" }
mp-audio = { path = "crates/mp-audio" }
serde = { version = "1", features = ["derive"] }
ron = "0.10"
toml = "1"
thiserror = "2"
midly = "0.5"
rustysynth = "1.3"
cpal = "0.18"
hound = "3.5"
mp3lame-encoder = "0.2"
arc-swap = "1"
rtrb = "0.3"
# eframe's default `system_fonts` feature pulls in color-font support, which paints
# Anonymous Pro's embedded bitmap strikes as white color glyphs instead of using the outlines.
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "wayland", "web_screen_reader", "wgpu", "x11"] }
egui = "0.37"
notify = "8"
dirs = "6"
clap = { version = "4", features = ["derive"] }
proptest = "1"
insta = { version = "1", features = ["ron"] }

[profile.dev]
opt-level = 1            # audio in debug builds must not glitch

[profile.dev.package."*"]
opt-level = 3            # dependencies (synth, encoder) fully optimized
